name: Quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Check repository invariants
        run: python scripts/check_repository.py

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m pyright --pythonpath "$(command -v python)"

      - name: Test
        run: python -m pytest

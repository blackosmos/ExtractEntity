[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "extract-entity"
version = "0.1.0"
description = "Local, quality-first object extraction tooling."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "Pillow>=12.0,<13",
]

[project.optional-dependencies]
dev = [
  "pyright>=1.1.403,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/extract_entity"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
